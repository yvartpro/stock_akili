name: Deploy AKILI stock to VPS

on:
  push:
    branches:
      - deploy

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            export NVM_DIR="$HOME/.nvm"

            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/yves/apps/stock

            git pull origin deploy

            npm install

            # Apply database migrations (non-destructive, preserves existing data)
            make migrate

            pm2 restart stock
      - name: Debug Secret Presence
        run: |
          echo "Is HOST set? ${{ secrets.VPS_HOST != '' }}"
          echo "Is USER set? ${{ secrets.VPS_USER != '' }}"
          echo "Is KEY set?  ${{ secrets.VPS_SSH_KEY != '' }}"
